services:
  - type: web
    name: devboard
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GOOGLE_CLIENT_ID
        value: 312237530138-2v1mrmvsjbt4bkohqc5akbulr91ri363.apps.googleusercontent.com
      - key: ADMIN_EMAIL
        value: temgoodboi@gmail.com
      - key: DATABASE_URL   # Neon/Supabase Postgres connection string; paste it in the Render dashboard
        sync: false
      - key: DISCORD_WEBHOOK_URL   # optional: Discord channel webhook for ready/fail/mention alerts
        sync: false
      - key: DISCORD_TESTER_ROLE_ID   # optional: Discord role ID to @mention when a card is ready to test
        sync: false
