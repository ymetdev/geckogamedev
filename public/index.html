<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevBoard</title>
<style>
:root{
  --bg:#0f1115;--panel:#161920;--card:#1c2029;--line:#262b36;--text:#e6e8ee;--mute:#8b93a5;
  --accent:#7c8cff;--ticket:#ff8a5c;--task:#5cc8ff;
  --open:#8b93a5;--prog:#f5c451;--test:#b48cff;--done:#4ade80;--bad:#f87171;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,Segoe UI,Inter,Sarabun,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;letter-spacing:.3px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--line);color:var(--text)}
.sp{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:#3a4150}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0d14;font-weight:600}
.btn.ok{background:var(--done);border-color:var(--done);color:#07210f;font-weight:600}
.btn.bad{color:var(--bad);border-color:#4a2a2e}
.userbox{position:relative}
.chip{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.role{font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:1px 7px;border-radius:8px;border:1px solid var(--line);color:var(--accent)}
.role.tester{color:var(--test)}.role.dev{color:var(--task)}.role.admin{color:var(--prog)}
.menu{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:200px;padding:6px;z-index:5;display:none}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--line)}
.trow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.trow .e{flex:1;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--bad);font-size:12px;min-height:16px}
main{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;padding:18px 20px;align-items:start;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute);margin:4px 6px 10px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%}
.count{margin-left:auto;background:var(--line);border-radius:10px;padding:0 8px;font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:#3a4150}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.tag.ticket{color:var(--ticket);border-color:#4a3228}.tag.task{color:var(--task);border-color:#22414f}
.pri-critical{color:var(--bad)}.pri-high{color:var(--prog)}
.title{margin:6px 0;font-weight:500}
.meta{color:var(--mute);font-size:12px}
.avatar{display:inline-block;background:var(--line);border-radius:10px;padding:0 8px;font-size:11px;color:var(--text)}
.empty{color:var(--mute);font-size:12px;text-align:center;padding:16px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:#000a}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:17px}
label{display:flex;flex-direction:column;gap:4px;color:var(--mute);font-size:12px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)}
textarea{min-height:90px;resize:vertical}
.sec{border-top:1px solid var(--line);padding-top:12px}
.sec h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.steps{margin:0;padding-left:20px}.steps li{margin:4px 0}
.box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.testbox{border-color:#3d3360;background:#17142a}
.cm{font-size:13px;margin:6px 0}.cm b{color:var(--accent)}
.hist{font-size:12px;color:var(--mute)}
.status{font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){main{grid-template-columns:repeat(4,260px)}}
</style>
</head>
<body>
<header>
  <h1>◆ DevBoard</h1>
  <div class="seg" id="typeSeg">
    <button data-v="" class="on">All</button><button data-v="ticket">Tickets</button><button data-v="task">Tasks</button>
  </div>
  <div class="seg" id="whoSeg">
    <button data-v="" class="on">Everyone</button><button data-v="mine">Mine</button><button data-v="unassigned">Unassigned</button>
  </div>
  <span class="sp"></span>
  <button class="btn primary" id="newBtn">+ New</button>
  <div id="userBox" class="userbox"></div>
</header>
<main id="board"></main>

<dialog id="newDlg"><form class="dlg" method="dialog" id="newForm">
  <h3>New card</h3>
  <div class="row">
    <label style="flex:1">Type<select name="type"><option value="ticket">Ticket (bug / request)</option><option value="task">Task</option></select></label>
    <label style="flex:1">Priority<select name="priority"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></label>
  </div>
  <label>Title<input name="title" required maxlength="200"></label>
  <label>Description (steps to reproduce, expected result, etc.)<textarea name="description"></textarea></label>
  <label>Tags (comma separated, e.g. UI, Combat, Audio)<input name="tags"></label>
  <div class="actions"><span class="sp"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Create</button></div>
</form></dialog>

<dialog id="loginDlg"><form class="dlg" id="loginForm">
  <h3>◆ DevBoard</h3>
  <div class="meta">Sign in with your Google account</div>
  <div id="gbtn" style="min-height:44px"></div>
  <div id="emailLogin" hidden>
    <label>Dev-only email login<input name="email" type="email" placeholder="you@studio.com"></label>
    <div class="actions" style="margin-top:8px"><span class="sp"></span><button class="btn primary">Continue</button></div>
  </div>
  <div class="err" id="loginErr"></div>
</form></dialog>

<dialog id="teamDlg"><div class="dlg">
  <h3>Team & roles</h3>
  <div id="teamList"></div>
  <form class="row" id="addUserForm" style="margin-top:6px">
    <input name="email" type="email" placeholder="email" required style="flex:2;min-width:140px">
    <input name="name" placeholder="name" style="flex:1;min-width:90px">
    <select name="role"><option>dev</option><option>tester</option><option>admin</option></select>
    <button class="btn primary">Add</button>
  </form>
  <div class="err" id="teamErr"></div>
  <div class="actions"><span class="sp"></span><button class="btn" onclick="$('#teamDlg').close()">Close</button></div>
</div></dialog>

<dialog id="tokenDlg"><div class="dlg">
  <h3>Connect Claude (MCP)</h3>
  <div class="meta">Run this in your terminal. The token is personal — don't share it.</div>
  <div class="box" id="tokenCmd" style="user-select:all;font-family:monospace;font-size:12px"></div>
  <div class="actions"><span class="sp"></span><button class="btn" onclick="$('#tokenDlg').close()">Close</button></div>
</div></dialog>

<dialog id="viewDlg"><div class="dlg" id="viewBody"></div></dialog>

<script>
const COLS=[['open','Open','--open'],['in_progress','In Progress','--prog'],['ready_to_test','Ready to Test','--test'],['complete','Complete','--done']];
const LABEL=Object.fromEntries(COLS.map(c=>[c[0],c[1]]));
const COLOR=Object.fromEntries(COLS.map(c=>[c[0],c[2]]));
let cards=[],fType='',fWho='',openId=null,user=null,users=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameOf=e=>users.find(u=>u.email===e)?.name||e;
const role=(...r)=>user&&r.includes(user.role);

async function api(method,path,body){
  const r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json(); if(r.status===401&&path!=='/login'){showLogin()} if(!r.ok) throw new Error(d.error||r.status); return d;
}
async function load(){ if(!user)return; try{[cards,users]=await Promise.all([api('GET','/cards'),api('GET','/users')]);render(); if(openId&&$('#viewDlg').open) showCard(openId,true)}catch(e){console.error(e)} }

function showLogin(){ user=null; $('#userBox').innerHTML=''; if(!$('#loginDlg').open)$('#loginDlg').showModal(); initLogin() }
function setUser(u){
  user=u; $('#loginDlg').close();
  $('#userBox').innerHTML=`<div class="chip" id="chip"><span>${esc(u.name)}</span><span class="role ${u.role}">${u.role}</span></div>
   <div class="menu" id="menu">
     <button data-m="token">Connect Claude (MCP token)</button>
     ${u.role==='admin'?'<button data-m="team">Team & roles</button>':''}
     <button data-m="out">Sign out</button></div>`;
  $('#chip').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('show')};
  $('#menu').querySelectorAll('button').forEach(b=>b.onclick=()=>menuAct(b.dataset.m));
  load();
}
document.addEventListener('click',()=>$('#menu')?.classList.remove('show'));
async function menuAct(m){
  if(m==='out'){await api('POST','/logout',{});showLogin()}
  if(m==='token'){const me=await api('GET','/me');
    $('#tokenCmd').textContent=`claude mcp add devboard -e DEVBOARD_URL=${location.origin} -e DEVBOARD_TOKEN=${me.token} -- node /path/to/devboard/mcp/server.js`;$('#tokenDlg').showModal()}
  if(m==='team'){renderTeam();$('#teamDlg').showModal()}
}
function renderTeam(){
  $('#teamList').innerHTML=users.map(u=>`<div class="trow"><span class="e">${esc(u.name)} <span class="meta">${esc(u.email)}</span></span>
    <select data-e="${esc(u.email)}">${['admin','dev','tester'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select>
    <button class="btn bad" data-del="${esc(u.email)}">Remove</button></div>`).join('');
  $('#teamList').querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{
    try{await api('PATCH','/users/'+encodeURIComponent(sel.dataset.e),{role:sel.value});$('#teamErr').textContent='';await load();if(sel.dataset.e===user.email)user.role=sel.value}catch(e){$('#teamErr').textContent=e.message;await load();renderTeam()}});
  $('#teamList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Remove '+b.dataset.del+'?'))return;
    try{await api('DELETE','/users/'+encodeURIComponent(b.dataset.del));$('#teamErr').textContent='';await load();renderTeam()}catch(e){$('#teamErr').textContent=e.message}});
}
$('#addUserForm').addEventListener('submit',async e=>{e.preventDefault();
  try{await api('POST','/users',Object.fromEntries(new FormData(e.target)));e.target.reset();$('#teamErr').textContent='';await load();renderTeam()}catch(err){$('#teamErr').textContent=err.message}});
let cfg=null;
async function initLogin(){
  cfg=cfg||await api('GET','/config');
  $('#emailLogin').hidden=!cfg.emailLogin;
  if(!cfg.googleClientId){ if(!cfg.emailLogin)$('#loginErr').textContent='Google sign-in is not configured on the server.'; return }
  if(!window.google){ await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)}).catch(()=>{$('#loginErr').textContent='Could not load Google sign-in';}) }
  if(!window.google)return;
  google.accounts.id.initialize({client_id:cfg.googleClientId,callback:async r=>{
    try{setUser(await api('POST','/login/google',{credential:r.credential}))}catch(err){$('#loginErr').textContent=err.message}}});
  $('#gbtn').innerHTML=''; google.accounts.id.renderButton($('#gbtn'),{theme:'filled_black',size:'large',shape:'rectangular'});
}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();
  try{setUser(await api('POST','/login',Object.fromEntries(new FormData(e.target))))}catch(err){$('#loginErr').textContent=err.message}});
$('#loginDlg').addEventListener('cancel',e=>e.preventDefault());

function visible(c){
  if(fType&&c.type!==fType)return false;
  if(fWho==='mine')return c.assignees.includes(user.email);
  if(fWho==='unassigned')return c.assignees.length===0;
  return true;
}
function render(){
  $('#board').innerHTML=COLS.map(([k,name,col])=>{
    const list=cards.filter(c=>c.status===k&&visible(c)).sort((a,b)=>b.updated_at.localeCompare(a.updated_at));
    return `<section class="col"><h2><span class="dot" style="background:var(${col})"></span>${name}<span class="count">${list.length}</span></h2>`+
      (list.map(cardHtml).join('')||'<div class="empty">—</div>')+'</section>';
  }).join('');
}
function cardHtml(c){
  return `<div class="card" data-id="${c.id}">
    <div class="row"><span class="tag ${c.type}">${c.type}</span><span class="meta">#${c.id}</span>
    <span class="meta pri-${c.priority}" style="margin-left:auto">${c.priority}</span></div>
    <div class="title">${esc(c.title)}</div>
    <div class="row">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
    ${c.assignees.map(a=>`<span class="avatar">@${esc(nameOf(a))}</span>`).join('')}</div></div>`;
}

function showCard(id,keep){
  const c=cards.find(x=>x.id===id); if(!c)return;
  openId=id; const mine=c.assignees.includes(user.email);
  const acts=[];
  if(c.status!=='complete'&&role('dev','admin')){
    acts.push(mine?`<button class="btn" data-a="unclaim">Release</button>`:`<button class="btn primary" data-a="claim">✋ I'll do this</button>`);
  }
  if(c.status==='ready_to_test'&&role('tester','admin')) acts.push(`<button class="btn ok" data-a="pass">✓ Pass → Complete</button><button class="btn bad" data-a="fail">✗ Fail → back to dev</button>`);
  if(c.status==='complete'&&role('tester','admin')) acts.push(`<button class="btn" data-a="reopen">Reopen</button>`);
  $('#viewBody').innerHTML=`
    <div class="row"><span class="tag ${c.type}">${c.type}</span><span class="meta">#${c.id} · by ${esc(nameOf(c.reporter))} · <span class="pri-${c.priority}">${c.priority}</span></span>
      <span class="status" style="margin-left:auto;color:var(${COLOR[c.status]});border:1px solid var(${COLOR[c.status]})">${LABEL[c.status]}</span></div>
    <h3>${esc(c.title)}</h3>
    <div class="row">${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${c.assignees.map(a=>`<span class="avatar">@${esc(nameOf(a))}</span>`).join('')||'<span class="meta">Unassigned</span>'}</div>
    ${c.description?`<div class="box">${esc(c.description)}</div>`:''}
    ${c.test_steps.length?`<div class="sec"><h4>🧪 How to test</h4>
      ${c.dev_summary?`<div class="box testbox" style="margin-bottom:8px">${esc(c.dev_summary)}</div>`:''}
      <ol class="steps">${c.test_steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
    <div class="actions">${acts.join('')}</div>
    <div class="sec"><h4>Comments</h4>
      ${c.comments.map(m=>`<div class="cm"><b>${esc(nameOf(m.user))}</b> ${esc(m.text)}</div>`).join('')||'<div class="meta">No comments</div>'}
      <div class="row" style="margin-top:8px"><input id="cmt" placeholder="Write a comment…" style="flex:1"><button class="btn" data-a="comment">Send</button></div></div>
    <details class="sec hist"><summary>History</summary>${c.history.map(h=>`<div>${new Date(h.at).toLocaleString()} · ${esc(nameOf(h.user))} · ${esc(h.action)} ${esc(h.text)}</div>`).join('')}</details>
    <div class="actions"><span class="sp"></span><button class="btn" data-a="close">Close</button></div>`;
  $('#viewBody').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(c,b.dataset.a));
  if(!keep&&!$('#viewDlg').open)$('#viewDlg').showModal();
}
async function act(c,a){
  if(a==='close')return $('#viewDlg').close();
  try{
    let body={};
    if(a==='comment'){body.text=$('#cmt').value; if(!body.text.trim())return}
    if(a==='fail'){body.text=prompt('Why did the test fail?'); if(!body.text)return}
    if(a==='pass'){body.text=''}
    await api('POST',`/cards/${c.id}/${a}`,body); await load();
    if(a==='pass'||a==='fail')$('#viewDlg').close();
  }catch(e){alert(e.message)}
}
$('#viewDlg').addEventListener('close',()=>openId=null);

$('#newBtn').onclick=()=>$('#newDlg').showModal();
$('#newForm').addEventListener('submit',async e=>{
  if(e.submitter?.value!=='ok'){return}
  const f=Object.fromEntries(new FormData(e.target));
  try{await api('POST','/cards',f); e.target.reset(); await load()}catch(err){alert(err.message)}
});
for(const [id,setter] of [['#typeSeg',v=>fType=v],['#whoSeg',v=>fWho=v]]){
  document.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll(id+' button').forEach(x=>x.classList.remove('on'));b.classList.add('on');setter(b.dataset.v);render()});
}
$('#board').addEventListener('click',e=>{const el=e.target.closest('.card');if(el)showCard(+el.dataset.id)});
api('GET','/me').then(setUser).catch(showLogin); setInterval(load,5000);
</script>
</body>
</html>
